    url: https://github.com/spf13/cobra
    commit: adbc8813901bba65827259daa8e22ff94ec1f30e
  - name: glow                 # Go CLI
    url: https://github.com/charmbracelet/glow
    commit: 8b0600fa445535b9c53194c0d4f7fe3cf700ef3e
  - name: taxonomy             # Next.js-приложение
    url: https://github.com/shadcn-ui/taxonomy
    commit: 298a8857c7128a0d121e7f699dfd729f23b3966d
  - name: zustand              # React-библиотека хуков
    url: https://github.com/pmndrs/zustand
    commit: 9fed2eb2f3af672da9f7bf694b996df3831fc207
  - name: bulletproof-react    # Vite SPA (каталог react-vite)
