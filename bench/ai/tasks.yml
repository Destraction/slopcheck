# Задачи корпуса ИИ-кода (v4, H1). Текст — как от обычного пользователя:
# без упоминания slop, линтеров и slopcheck. Seed — каталог в seeds/.
tasks:
  # ------------------------------------------------------------------ Go
  - id: go-pagination
    seed: go-service
    prompt: >
      Добавь пагинацию в GET /notes: параметры limit и offset, разумные значения
      по умолчанию и проверка некорректных значений. В ответе нужно общее число заметок.
  - id: go-sqlite
    seed: go-service
    prompt: >
      Сейчас заметки живут в памяти. Добавь хранение в SQLite: путь к базе из
      переменной окружения NOTES_DB, если не задана — оставить хранение в памяти.
  - id: go-auth
    seed: go-service
    prompt: >
      Закрой API ключом: клиент передаёт заголовок X-API-Key, ключ берётся из
      переменной окружения NOTES_API_KEY. Без ключа или с неверным ключом — 401.
  - id: go-webhook
    seed: go-service
    prompt: >
      При создании заметки нужно отправлять POST с JSON заметки на URL из
      NOTES_WEBHOOK_URL. Внешний сервис иногда падает — нужны повторы и таймауты,
      но создание заметки не должно от этого тормозить.
  - id: go-search
    seed: go-service
    prompt: >
      Добавь поиск: GET /notes/search?q=...&tag=... — по подстроке в заголовке и
      тексте без учёта регистра и по тегу. Оба параметра необязательные.
  - id: go-ratelimit
    seed: go-service
    prompt: >
      Добавь ограничение частоты запросов по IP клиента: не больше 60 запросов в
      минуту, сверх лимита — 429 с заголовком Retry-After.
  - id: go-update
    seed: go-service
    prompt: >
      Добавь редактирование заметки: PATCH /notes/{id}, можно менять заголовок,
      текст и теги по отдельности. Пустой заголовок запрещён.
  - id: go-tests
    seed: go-service
    prompt: >
      Покрой хранилище и HTTP-хендлеры тестами — сейчас их почти нет. Хочу быть
      уверен, что всё работает, включая ошибки и конкурентный доступ.
  # ------------------------------------------------------------------ React
  - id: react-search
    seed: react-app
    prompt: >
      Добавь над списком поле поиска: фильтрация заметок по заголовку и тексту по
      мере ввода, с небольшой задержкой, чтобы не дёргать фильтр на каждую букву.
  - id: react-form
    seed: react-app
    prompt: >
      Сделай форму создания заметки: заголовок обязателен, текст до 1000 символов,
      ошибки показывать под полями, после успешного создания заметка появляется в списке.
  - id: react-fetch-hook
    seed: react-app
    prompt: >
      Вынеси загрузку данных в переиспользуемый хук: состояния загрузки и ошибки,
      повторная загрузка по кнопке. Покажи спиннер и сообщение об ошибке в App.
  - id: react-table
    seed: react-app
    prompt: >
      Замени список на таблицу заметок с сортировкой по заголовку и дате создания
      (клик по заголовку колонки) и пагинацией по 10 штук.
  - id: react-theme
    seed: react-app
    prompt: >
      Добавь переключатель светлой и тёмной темы. Выбор должен сохраняться между
      перезагрузками, а по умолчанию брать системную тему.
  - id: react-delete
    seed: react-app
    prompt: >
      Добавь удаление заметки с подтверждением в модальном окне. Модалка должна
      закрываться по Escape и по клику вне окна. API: DELETE /api/notes/{id}.
  - id: react-tags
    seed: react-app
    prompt: >
      Покажи теги у заметок и сделай фильтр по тегам: клик по тегу добавляет его в
      фильтр, показываются заметки со всеми выбранными тегами, фильтр можно сбросить.
  - id: react-tests
    seed: react-app
    prompt: >
      Напиши тесты для компонентов и для api.ts — сейчас тестов почти нет. Нужно
      проверить и успешные сценарии, и ошибки сервера.
