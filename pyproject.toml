[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slopcheck"
dynamic = ["version"]
description = "Детектор AI slop без ИИ: оркестратор поверх статических анализаторов"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ai", "slop", "lint", "code-quality", "static-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/Destraction/slopcheck"
Repository = "https://github.com/Destraction/slopcheck"

[project.optional-dependencies]
# Python-детекторы, вызываемые адаптерами напрямую (API) или как бинарники.
detectors = [
    "vulture>=2.14",
    "deptry>=0.23",
    "interrogate>=1.7",
    "lizard>=1.17",
    "semgrep>=1.100",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
slopcheck = "slopcheck.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/slopcheck"]

[tool.hatch.version]
path = "src/slopcheck/__init__.py"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.deptry]
# slopcheck — первопартийный пакет; без этого deptry ложно считает
# `import slopcheck` транзитивной зависимостью (DEP003) во всех своих файлах.
known_first_party = ["slopcheck"]

[tool.deptry.per_rule_ignores]
# Детекторы и pytest — CLI-тулы, вызываются как subprocess, а не импортируются;
# deptry ложно метит их DEP002 («объявлена, но не используется»).
DEP002 = ["vulture", "deptry", "interrogate", "lizard", "semgrep", "pytest"]
