[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slopcheck"
version = "0.1.0"
description = "Детектор AI slop без ИИ: оркестратор поверх статических анализаторов"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Python-детекторы, вызываемые адаптерами напрямую (API) или как бинарники.
detectors = [
    "vulture>=2.14",
    "deptry>=0.23",
    "interrogate>=1.7",
    "lizard>=1.17",
    "semgrep>=1.100",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
slopcheck = "slopcheck.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/slopcheck"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.deptry]
# slopcheck — первопартийный пакет; без этого deptry ложно считает
# `import slopcheck` транзитивной зависимостью (DEP003) во всех своих файлах.
known_first_party = ["slopcheck"]

[tool.deptry.per_rule_ignores]
# Детекторы и pytest — CLI-тулы, вызываются как subprocess, а не импортируются;
# deptry ложно метит их DEP002 («объявлена, но не используется»).
DEP002 = ["vulture", "deptry", "interrogate", "lizard", "semgrep", "pytest"]
