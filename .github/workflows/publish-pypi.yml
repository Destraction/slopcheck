# Публикация slopcheck на PyPI по тегу вида vX.Y.Z.
#
# Перед первым релизом настроить Trusted Publisher на pypi.org:
# Publishing -> Add a new publisher -> GitHub -> owner/repo = Destraction/slopcheck,
# workflow = publish-pypi.yml, environment = pypi.
# Токены и пароли не нужны — публикация идёт через OpenID Connect (Trusted Publishing).

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
