# Сборка и публикация образа slopcheck в GitHub Container Registry (GHCR).
# Готовый образ тянут consumer-репозитории вместо локальной сборки.

name: publish-image

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "Dockerfile"
      - "pyproject.toml"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/destraction/slopcheck:latest
            ghcr.io/destraction/slopcheck:${{ github.sha }}
