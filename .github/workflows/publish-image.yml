# Сборка и публикация образа slopcheck в GitHub Container Registry (GHCR).
# Готовый образ тянут consumer-репозитории вместо локальной сборки.

name: publish-image

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
  # paths-фильтр убран: GitHub Actions некорректно сочетает paths с push по tags
  # (тег без изменений в src/** просто не соберёт образ) — пожертвовали фильтром
  # ради надёжной сборки semver-тегов.

# Параллельные пуши в master не должны наперегонки перезаписывать :latest —
# сборки идут по очереди, без отмены (каждый sha-тег должен опубликоваться).
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Теги вычисляются из события: semver-теги (version/major.minor/major) —
      # только при пуше тега вида vX.Y.Z; latest — только на master; sha — всегда.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/destraction/slopcheck
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
