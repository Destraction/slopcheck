# PR- и push-workflow: delta-гейт slopcheck внутри пайплайна.
#
# Триггеры:
#   pull_request — база = целевая ветка PR;
#   push         — база = предыдущий коммит (github.event.before).
# Если базы нет (новая ветка / первый пуш) — гейт пропускается, остаётся отчёт.
#
# Логика: собрать образ → определить базу → отчёт по базе (base.json) →
# отчёт по текущему коду (SARIF + summary) → загрузить SARIF → delta-гейт.
#
# В своём репозитории замените `docker build` на pull опубликованного образа:
#   docker pull ghcr.io/destraction/slopcheck:latest

name: slopcheck

on:
  pull_request:
  push:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  slopcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # нужен доступ к base sha

      - name: Build slopcheck image
        run: docker build -t slopcheck:ci .

      - name: Resolve baseline
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          ZERO="0000000000000000000000000000000000000000"
          if [ -z "$BASE" ] || [ "$BASE" = "$ZERO" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "has_base=false" >> "$GITHUB_OUTPUT"
            echo "База не найдена (новая ветка/первый пуш) — гейт будет пропущен."
          else
            echo "has_base=true" >> "$GITHUB_OUTPUT"
            echo "sha=$BASE" >> "$GITHUB_OUTPUT"
          fi

      - name: Baseline report
        if: steps.base.outputs.has_base == 'true'
        run: |
          git worktree add ../base "${{ steps.base.outputs.sha }}"
          docker run --rm -v "$PWD/../base:/src" slopcheck:ci run /src --format json > base.json

      - name: Report (SARIF + summary)
        run: |
          docker run --rm -v "$PWD:/src" slopcheck:ci run /src --format sarif > slopcheck.sarif
          docker run --rm -v "$PWD:/src" slopcheck:ci run /src --format md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slopcheck-sarif
          path: slopcheck.sarif

      # Загрузка в Code Scanning требует GitHub Advanced Security; на приватном
      # репо без GHAS шаг недоступен — неблокирующий, чтобы гейт всё равно отработал.
      - name: Upload SARIF to Code Scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: slopcheck.sarif

      - name: Delta gate
        if: steps.base.outputs.has_base == 'true'
        run: docker run --rm -v "$PWD:/src" slopcheck:ci gate /src --baseline /src/base.json
