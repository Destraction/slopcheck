# slopcheck — привратник качества для ЛЮБОГО репозитория.
# Тянет готовый образ ghcr.io/destraction/slopcheck (не собирает локально)
# и гоняет delta-гейт: валит, только если добавлен новый slop.
#
# Ставится автоматически в новые репо через `ghnew` / `slopcheck-init`
# (см. репозиторий Destraction/slopcheck, каталог consumer/).

name: slopcheck

on:
  pull_request:
  push:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  packages: read
  security-events: write

jobs:
  slopcheck:
    runs-on: ubuntu-latest
    env:
      # Пин на минорную ветку 0.1: патчи (0.1.x) прилетают автоматически,
      # минор/мажор — только осознанным обновлением этой строки.
      IMAGE: ghcr.io/destraction/slopcheck:0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Пакет slopcheck в GHCR приватный: GITHUB_TOKEN чужого репо доступа не имеет.
      # GHCR_PULL_TOKEN (PAT с read:packages) раскатывается автоматически через
      # slopcheck-init / ghnew; fallback на GITHUB_TOKEN — если пакет станет public.
      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull slopcheck image
        run: docker pull "$IMAGE"

      - name: Resolve baseline
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          ZERO="0000000000000000000000000000000000000000"
          if [ -z "$BASE" ] || [ "$BASE" = "$ZERO" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "has_base=false" >> "$GITHUB_OUTPUT"
            echo "База не найдена (новая ветка/первый пуш) — гейт будет пропущен."
          else
            echo "has_base=true" >> "$GITHUB_OUTPUT"
            echo "sha=$BASE" >> "$GITHUB_OUTPUT"
          fi

      - name: Baseline report
        if: steps.base.outputs.has_base == 'true'
        run: |
          git worktree add ../base "${{ steps.base.outputs.sha }}"
          docker run --rm -v "$PWD/../base:/src" "$IMAGE" run /src --format json > "$RUNNER_TEMP/base.json"

      - name: Report (SARIF + summary)
        run: |
          docker run --rm -v "$PWD:/src" "$IMAGE" run /src --format sarif > "$RUNNER_TEMP/slopcheck.sarif"
          docker run --rm -v "$PWD:/src" "$IMAGE" run /src --format md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slopcheck-sarif
          path: ${{ runner.temp }}/slopcheck.sarif

      - name: Upload SARIF to Code Scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ runner.temp }}/slopcheck.sarif

      - name: Delta gate
        if: steps.base.outputs.has_base == 'true'
        run: docker run --rm -v "$RUNNER_TEMP/base.json:/base/base.json:ro" -v "$PWD:/src" "$IMAGE" gate /src --baseline /base/base.json

      # Красный гейт → в Summary добавляется инструкция, как починить (автофикс).
      - name: How to fix (autofix instructions)
        if: failure()
        run: |
          {
            echo ""
            echo "## ❌ Гейт красный — как починить"
            echo ""
            echo "Находки выше (формат: \`детектор файл:строка — описание\`). Чинится код, не конфиг."
            echo ""
            echo "**Автофикс (Claude Code):** скажи агенту \`почини slopcheck в CI\` или вызови \`/slopcheck\` —"
            echo "он возьмёт находки этого прогона, исправит код (без изменения поведения, с тестами до/после),"
            echo "запушит и дождётся зелёного чека."
            echo ""
            echo "**Вручную:**"
            echo '```bash'
            echo "# локальный прогон до пуша:"
            echo "docker run --rm -v \"\$PWD:/src\" ghcr.io/destraction/slopcheck:latest run /src"
            echo '```'
            echo "duplication → вынести общее в функцию; deadcode → удалить неиспользуемое;"
            echo "comments → убрать закомментированный код; complexity → guard clauses / разбить функцию."
            echo ""
            echo "Запрещено «чинить» ослаблением \`.slopcheck.yml\` или удалением workflow."
          } >> "$GITHUB_STEP_SUMMARY"
