rules:
  - id: swallowed-exception
    languages: [python]
    severity: WARNING
    message: >
      Исключение проглочено (except ...: pass) — ошибка теряется молча.
    patterns:
      - pattern: |
          try:
              ...
          except $E:
              pass

  - id: bare-except
    languages: [python]
    severity: WARNING
    message: >
      Голый except перехватывает всё, включая KeyboardInterrupt/SystemExit.
    pattern: |
      try:
          ...
      except:
          ...

  - id: mutable-default-arg
    languages: [python]
    severity: WARNING
    message: >
      Изменяемый аргумент по умолчанию ([] / {}) разделяется между вызовами.
    patterns:
      - pattern-either:
          - pattern: |
              def $F(..., $A=[], ...):
                  ...
          - pattern: |
              def $F(..., $A={}, ...):
                  ...

  - id: eq-none
    languages: [python]
    severity: INFO
    message: >
      Сравнение с None через ==; идиоматично `is None`.
    pattern-either:
      - pattern: $X == None
      - pattern: $X != None

  # ------------------------------------------------------------- JavaScript / TypeScript
  - id: empty-catch
    languages: [javascript, typescript]
    severity: WARNING
    message: >
      Пустой catch — ошибка проглочена без обработки.
    pattern: |
      try { ... } catch ($E) {}

  - id: debugger-statement
    languages: [javascript, typescript]
    severity: INFO
    message: >
      Оставлен debugger; — отладочный след в коде.
    pattern: debugger;

  - id: loose-eq-null
    languages: [javascript, typescript]
    severity: INFO
    message: >
      Нестрогое сравнение с null (== / !=); обычно нужен === / !==.
    pattern-either:
      - pattern: $X == null
      - pattern: $X != null

  # ------------------------------------------------------------- Go
  - id: swallowed-error-go
    languages: [go]
    severity: WARNING
    message: >
      Возврат присвоен _ — возможная ошибка проигнорирована.
    pattern: _ = $F(...)

  - id: bare-panic-go
    languages: [go]
    severity: INFO
    message: >
      panic() в коде — предпочтительнее возврат error.
    pattern: panic(...)
