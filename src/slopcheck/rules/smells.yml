rules:
  - id: swallowed-exception
    languages: [python]
    severity: WARNING
    message: >
      Исключение проглочено (except ...: pass) — ошибка теряется молча.
    patterns:
      - pattern: |
          try:
              ...
          except $E:
              pass

  - id: bare-except
    languages: [python]
    severity: WARNING
    message: >
      Голый except перехватывает всё, включая KeyboardInterrupt/SystemExit.
    pattern: |
      try:
          ...
      except:
          ...

  - id: mutable-default-arg
    languages: [python]
    severity: WARNING
    message: >
      Изменяемый аргумент по умолчанию ([] / {}) разделяется между вызовами.
    patterns:
      - pattern-either:
          - pattern: |
              def $F(..., $A=[], ...):
                  ...
          - pattern: |
              def $F(..., $A={}, ...):
                  ...

  - id: eq-none
    languages: [python]
    severity: INFO
    message: >
      Сравнение с None через ==; идиоматично `is None`.
    pattern-either:
      - pattern: $X == None
      - pattern: $X != None

  # ------------------------------------------------------------- JavaScript / TypeScript
  - id: empty-catch
    languages: [javascript, typescript]
    severity: WARNING
    message: >
      Пустой catch — ошибка проглочена без обработки.
    pattern: |
      try { ... } catch ($E) {}

  - id: debugger-statement
    languages: [javascript, typescript]
    severity: INFO
    message: >
      Оставлен debugger; — отладочный след в коде.
    pattern: debugger;

  - id: loose-equality
    languages: [javascript, typescript]
    severity: INFO
    message: >
      Нестрогое сравнение (== / !=) — обычно нужен === / !==.
    patterns:
      - pattern-either:
          - pattern: $X == $Y
          - pattern: $X != $Y
      # `x == null` — не халтура, а идиома: единственный способ проверить
      # null и undefined одним сравнением (так же считает eslint eqeqeq
      # с опцией null: ignore). Флажить её — топить отчёт ложными находками.
      - pattern-not: $X == null
      - pattern-not: $X != null
      - pattern-not: null == $X
      - pattern-not: null != $X
      - pattern-not: $X == undefined
      - pattern-not: $X != undefined
      - pattern-not: undefined == $X
      - pattern-not: undefined != $X

  # ------------------------------------------------------------- Go
  - id: swallowed-error-go
    languages: [go]
    # Явное `_ =` — осознанный отказ от ошибки (корпус: 27 из 27 намеренные);
    # неявный пропуск ловит errcheck.
    severity: INFO
    message: >
      Возврат присвоен _ — возможная ошибка проигнорирована.
    pattern: _ = $F(...)

  - id: bare-panic-go
    languages: [go]
    severity: INFO
    message: >
      panic() в коде — предпочтительнее возврат error.
    pattern: panic(...)

  # ------------------------------------------------------------- лишняя защитность
  - id: useless-reraise
    languages: [python]
    severity: WARNING
    message: >
      except, который только пробрасывает исключение дальше, ничего не делает — уберите try.
    pattern-either:
      - pattern: |
          try:
              ...
          except $E:
              raise
      - pattern: |
          try:
              ...
          except $E as $ERR:
              raise $ERR

  # ------------------------------------------------------------- React
  - id: trivial-usememo
    languages: [javascript, typescript]
    severity: INFO
    message: >
      useMemo вокруг литерала или чтения поля — мемоизация дороже самого вычисления.
    pattern-either:
      - pattern: useMemo(() => $OBJ.$FIELD, $DEPS)
      - patterns:
          - pattern: useMemo(() => $LIT, $DEPS)
          - metavariable-regex:
              metavariable: $LIT
              regex: ^(-?\d+(\.\d+)?|true|false|null|undefined|"[^"]*"|'[^']*')$
